[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yantrikdb-dashboard"
version = "0.3.0"
description = "Standalone HTTP dashboard for YantrikDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YantrikDB Dashboard contributors" }]
keywords = ["yantrikdb", "memory", "dashboard", "fastapi", "supabase"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "websocket-client>=1.8",
]

[project.scripts]
yantrikdb-dashboard = "app:main"

[tool.setuptools]
py-modules = ["app", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
