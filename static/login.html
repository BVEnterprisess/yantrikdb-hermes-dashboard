<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Sign in · YantrikDB for Hermes</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #090d15; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #17243a 0%, #090d15 62%); }
    main { width: min(100%, 430px); padding: 36px; border: 1px solid #263449; border-radius: 20px; background: rgba(13, 20, 32, .94); box-shadow: 0 24px 80px rgba(0,0,0,.38); }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
    .brand img { width: 38px; height: 38px; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .brand span { color: #91a0b6; font-size: 12px; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.03em; }
    .intro { margin: 0 0 26px; color: #96a4b8; line-height: 1.55; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; color: #c4cfde; font-size: 13px; }
    input { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #31415a; border-radius: 9px; background: #0a111d; color: #f1f5fb; font: inherit; outline: none; }
    input:focus { border-color: #7d9ac4; box-shadow: 0 0 0 3px rgba(125,154,196,.14); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    button { min-height: 44px; padding: 0 14px; border: 1px solid #3b4d67; border-radius: 9px; background: #17243a; color: #edf3fc; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    button.primary { border-color: #6c88b1; background: #38577f; }
    button:disabled { cursor: wait; opacity: .55; }
    #authMessage { margin: 18px 0 0; padding: 12px 13px; border: 1px solid #405d4e; border-radius: 9px; background: #122219; color: #bde5c9; font-size: 13px; line-height: 1.5; }
    #authMessage[data-state="error"] { border-color: #75454a; background: #28171b; color: #f0bdc2; }
    #authMessage[hidden] { display: none; }
    .foot { margin: 22px 0 0; color: #718198; font-size: 11px; line-height: 1.5; }
    @media (max-width: 440px) { main { padding: 26px 22px; } .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/static/assets/favicon.svg" alt="" />
      <div><strong>YantrikDB</strong><span>for Hermes</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="intro">Use your Supabase Auth account to access the memory operations dashboard.</p>
    <form id="authForm">
      <label for="authEmail">Email address</label>
      <input id="authEmail" name="email" type="email" autocomplete="username" required />
      <label for="authPassword">Password</label>
      <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required />
      <div class="actions">
        <button id="signInButton" class="primary" type="submit">Sign in</button>
        <button id="signUpButton" type="button">Create account</button>
      </div>
    </form>
    <p id="authMessage" role="status" aria-live="polite" hidden></p>
    <p class="foot">Account verification and password recovery are managed by the connected Supabase project.</p>
  </main>
  <script type="module" src="/static/auth.js?v=supabase-auth-1"></script>
</body>
</html>
